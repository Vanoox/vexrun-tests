name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# cleanup deletes all forms in the team, so no parallel runs
concurrency:
  group: api-tests
  cancel-in-progress: false

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run API tests
        run: pnpm test:api
        env:
          X_TEAM_ID_TEST_API: ${{ secrets.X_TEAM_ID_TEST_API }}
          X_API_KEY_TEST_API: ${{ secrets.X_API_KEY_TEST_API }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
